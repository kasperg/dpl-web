# This is a go-task file solely for database snapshot handling.
# It is meant to be used in combination with the go-task file in the root of
# the project.
version: "3"

tasks:
  export:
    summary: Export the current site-installed Drupal database for the snapshot image build.
    cmds:
      - mkdir -p .build
      - rm -f .build/dpl-cms-default.sql
      - task dev:cli -- drush sql:dump --result-file=/app/.build/dpl-cms-default.sql

  build:
    summary: Build the database snapshot image.
    cmds:
      - docker build -f {{ .LAGOON_DIR }}/database-snapshot.dockerfile --tag {{ .DB_SNAPSHOT_FULL_NAME }} --tag {{ .DB_SNAPSHOT_LATEST_NAME }} .

  push:
    summary: Push the database snapshot image to container registry.
    deps: [ghcr:login]
    cmds:
      - docker push {{ .DB_SNAPSHOT_FULL_NAME }}
      - docker push {{ .DB_SNAPSHOT_LATEST_NAME }}

  deploy:
    desc: Export, build, and push the database snapshot image.
    cmds:
      - task: database-snapshot:export
      - task: database-snapshot:build
      - task: database-snapshot:push
